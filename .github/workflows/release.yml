name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

permissions:
  contents: write

concurrency:
  group: desktop-release
  queue: max

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - name: Validate release and prepare updater configuration
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc[1-9][0-9]*)?$') {
            throw "Unsupported release tag: $tag"
          }
          $notes = "docs/release/releasenote-$tag.md"
          if (!(Test-Path -LiteralPath $notes -PathType Leaf) -or
              [string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notes -Raw))) {
            throw "Missing or empty release notes: $notes"
          }
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_PUBLIC_KEY)) {
            throw 'Set the TAURI_UPDATER_PUBLIC_KEY repository variable.'
          }
          @{
            version = $tag.Substring(1) -replace '-rc([0-9]+)$', '-rc.$1'
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{
              updater = @{
                pubkey = $env:UPDATER_PUBLIC_KEY.Trim()
                endpoints = @("$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/updates/latest.json")
              }
            }
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "$env:RUNNER_TEMP/livecap-release.json"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - name: Build signed Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Set the TAURI_SIGNING_PRIVATE_KEY repository secret.'
          }
          npm run tauri -- build --ci --bundles nsis --config "$env:RUNNER_TEMP/livecap-release.json" -- --locked
      - name: Publish version and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/publish-release.ps1

  macos:
    needs: windows
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: sh scripts/test-macos-audio.sh
      - name: Prepare macOS release configuration
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          if (!process.env.UPDATER_PUBLIC_KEY?.trim()) throw new Error('Missing TAURI_UPDATER_PUBLIC_KEY');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/livecap-release.json`, JSON.stringify({
            version: process.env.GITHUB_REF_NAME.slice(1).replace(/-rc(\d+)$/, '-rc.$1'),
            bundle: { createUpdaterArtifacts: true },
            plugins: { updater: { pubkey: process.env.UPDATER_PUBLIC_KEY.trim() } }
          }));
          JS
      - name: Build macOS Apple Silicon application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --ci --target aarch64-apple-darwin --bundles app,dmg --config "$RUNNER_TEMP/livecap-release.json" -- --locked
      - name: Verify application signatures in macOS artifacts
        run: node scripts/verify-macos-bundles.mjs src-tauri/target/aarch64-apple-darwin/release/bundle --updater
      - name: Publish macOS assets and extend update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          gh release upload "$GITHUB_REF_NAME" "$bundle"/dmg/*.dmg "$bundle"/macos/*.app.tar.gz "$bundle"/macos/*.app.tar.gz.sig --clobber
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --output "$RUNNER_TEMP/latest.json" --clobber
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const directory = 'src-tauri/target/aarch64-apple-darwin/release/bundle/macos';
          const archives = fs.readdirSync(directory).filter(name => name.endsWith('.app.tar.gz'));
          if (archives.length !== 1) throw new Error('Expected exactly one macOS updater archive');
          const name = archives[0];
          const signature = fs.readFileSync(`${directory}/${name}.sig`, 'utf8').trim();
          if (!signature) throw new Error('Empty macOS updater signature');
          const file = `${process.env.RUNNER_TEMP}/latest.json`;
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          manifest.platforms['darwin-aarch64'] = {
            signature,
            url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.GITHUB_REF_NAME}/${encodeURIComponent(name)}`
          };
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2));
          JS
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/latest.json" --clobber
          gh release download updates --pattern latest.json --output "$RUNNER_TEMP/current.json" --clobber
          if node --input-type=module -e 'import fs from "node:fs"; const read = n => JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${n}.json`)); process.exit(read("current").version === read("latest").version ? 0 : 1)'; then
            gh release upload updates "$RUNNER_TEMP/latest.json" --clobber
          fi
