name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - name: Verify macOS PCM conversion
        if: runner.os == 'macOS'
        run: sh scripts/test-macos-audio.sh
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: npm run tauri -- build --debug --no-bundle -- --locked
      - name: Build macOS application and disk image
        if: runner.os == 'macOS'
        run: npm run tauri -- build --debug --bundles app,dmg -- --locked
      - name: Verify application signatures in macOS artifacts
        if: runner.os == 'macOS'
        run: node scripts/verify-macos-bundles.mjs src-tauri/target/debug/bundle
